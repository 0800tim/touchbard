# Touch Bar layout — ~/.config/touchbar/config.toml
#
# Changes apply the moment you save. Colours follow your Omarchy theme.
# A typo keeps the last good layout and shows a notification.
#
# ── Items ───────────────────────────────────────────────────────────────
# Each layer is a list of items, left to right. An item is either a preset
# name or a table.
#
# Presets:
#   esc fn back           escape, the F-key switch, back to the main layer
#   brightness keyboard volume
#                         sliders: tap to open, or press and slide straight away
#   mute mic              toggles that light up red when muted
#   media nowplaying      ⏮ ⏯ ⏭ and the current track, with a live spectrum
#                         behind it; tap it for the full-width visualiser
#   eq                    turns the spectrum behind the title on and off
#   karaoke               lyrics instead of the title (also the mic button in full-screen mode)
#   workspaces            Hyprland workspaces; tap one to switch
#   apps menu screenshot record lock nightlight emoji   (Omarchy commands)
#   overview              Quickshell overview (qs -c overview), if you run one
#   clock battery
#   weather               conditions, temperature and wind; tap for the next 12 hours
#   F1 … F12
#   flex                  stretchy empty space
#   gap  gap:40           fixed empty space (14 px, or the width you give)
#
# Tables — your own buttons:
#   { icon = "󰈹", command = "omarchy launch browser" }
#   { label = "Build", command = "cd ~/Projects/app && make", width = 120 }
#   { icon = "󰆏", keys = ["LeftCtrl", "C"] }          # key chord
#   { label = "Dev", layer = "dev" }                   # go to a layer
#   { preset = "clock", format = "%H:%M:%S" }          # tweak a preset
#   { plugin = "name", width = 400 }                   # a plugin surface (touchbar-agent plugin list)
#
#   icon      any Nerd Font glyph (https://www.nerdfonts.com/cheat-sheet)
#   label     text, drawn next to the icon if there is one
#   width     pixels (the bar is 2008 wide); leave it out to share leftover space
#   style     normal | accent | subtle | plain | danger
#   command   runs in your session, like a Hyprland binding
#   keys      key names from https://docs.rs/input-linux/latest/input_linux/enum.Key.html
#
# Try:  touchbar-agent --dump-layout   to see the expanded result.

[settings]
default_layer = "control"
esc = "auto"                 # on-bar Esc: "auto" (only on Macs without a physical Esc key), "show" or "hide"
fn_key_layer = "function"    # shown while you hold the fn key
dim_after = 30               # seconds of no input before the bar dims
off_after = 60               # ...and turns off (touch it to wake)
max_brightness = 160         # 0–255; the bar follows your screen brightness up to this
slider_timeout = 5           # seconds before an opened slider tucks itself away
fingerprint_width = 440      # width of the Touch ID prompt at the right end
dim_while_scanning = true    # fade the rest of the bar while Touch ID waits
nowplaying = "bars"          # behind the track title: "bars" (equaliser), "art" (album cover) or "off"
viz_colors = "music"         # equaliser colours: "music" (the track's artwork), "live" (follows the video
                             # as it plays; samples the player window at thumbnail size every 2 s),
                             # "mono", "smoke", "amethyst", "matrix", "disco", "rainbow" or "theme".
                             # In full-screen mode the palette button cycles these, and the Aa
                             # button cycles text styles; both are remembered.

[weather]
# Units follow the location's country (°F and mph only in the US) unless set here.
# units = "metric"           # "auto", "metric" or "imperial"
# temperature = "c"          # "c" or "f"
# wind = "kn"                # "kmh", "kn", "mph" or "ms"
# location = "Auckland"      # a place name or "lat,lon"; default: Omarchy's weather location, else your IP
# clock = "12h"              # hour labels in the forecast: "12h" or "24h"
# show_wind = true
# windy_above_kmh = 40       # gusts above this swap the icon for a windy one

[theme]
# Every colour comes from the current Omarchy theme. Override any role with
# a hex colour or the name of a theme colour (red, magenta, accent, ...):
# background = "#000000"     # true black, as on macOS
# button     = "selection"
# accent     = "magenta"
# foreground = "#ffffff"

[layers.control]
items = [
  "esc", "fn",
  "gap",
  "apps", "screenshot",
  "weather",
  "eq", "nowplaying",
  "media",
  "gap",
  "brightness", "keyboard",
  "gap",
  "volume", "mute",
]

[layers.function]
items = [
  "esc", "fn",
  "F1", "F2", "F3", "F4", "F5", "F6",
  "F7", "F8", "F9", "F10", "F11", "F12",
]

